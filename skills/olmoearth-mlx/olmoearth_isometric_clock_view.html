<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OlmoEarth Information Clock</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1b1f31 0%, #0b0f1a 70%);
      color: #e8ebff;
    }
    .wrap {
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.01em;
    }
    p {
      margin: 0 0 12px;
      color: #b5bfd8;
    }
    #canvas {
      position: relative;
      width: 100%;
      height: 80vh;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a3352;
      background:
        linear-gradient(90deg, transparent 0, transparent 49px, #2e3654 50px),
        linear-gradient(0deg, transparent 0, transparent 49px, #2e3654 50px),
        #11182d;
      background-size: 50px 50px;
    }
    .clock {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #45517a;
      background: rgba(10, 16, 32, 0.75);
      backdrop-filter: blur(3px);
      font-size: 12px;
    }
    .node {
      position: absolute;
      border-radius: 10px;
      border: 1px solid;
      transform: translate(-50%, -100%);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.55);
      transition: transform 120ms ease;
      cursor: default;
    }
    .node:hover {
      z-index: 10;
      transform: translate(-50%, -100%) scale(1.04);
    }
    .node .top {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      padding: 6px 8px 5px;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 45%);
      border-bottom: 1px solid rgba(255,255,255,0.18);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node .meta {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      color: rgba(236, 240, 255, 0.88);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .node .label {
      position: absolute;
      inset: auto;
      right: 8px;
      top: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.85);
    }
    .edge {
      position: absolute;
      width: 2px;
      transform-origin: 0 0;
      z-index: 0;
      opacity: 0.6;
      background: linear-gradient(90deg, rgba(130, 145, 210, 0.95), rgba(130,145,210,0.05));
    }
    .legend {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      max-width: 680px;
      font-size: 12px;
      color: #d5ddff;
    }
    .legend-item {
      border: 1px solid #45517a;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 20, 39, 0.74);
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.4);
    }
  </style>
</head>

    </div>
