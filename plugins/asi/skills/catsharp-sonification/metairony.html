<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Metairony • CatSharp Sonification</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; background: #0a0a0f; overflow: hidden; font-family: monospace; }
    #info { position: fixed; top: 10px; left: 10px; color: #888; font-size: 12px; z-index: 100; }
    #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
    button { background: #1a1a2e; color: #c850c0; border: 1px solid #c850c0; padding: 12px 24px; 
             margin: 5px; cursor: pointer; font-family: monospace; font-size: 14px; border-radius: 4px; }
    button:hover { background: #2a2a4e; }
    .active { background: #c850c0; color: #000; }
  </style>
</head>
<body>
  <div id="info">METAIRONY • Click to begin</div>
  <div id="controls">
    <button onclick="playInside()">Inside Lines</button>
    <button onclick="playOutside()">Outside Lines</button>
    <button onclick="playMeta()">Metaironic Bridge</button>
    <button onclick="playBisimilar()">Bisimilarity</button>
    <button onclick="playAll()">▶ FULL METAIRONY</button>
  </div>
  
<script>
// ═══════════════════════════════════════════════════════════════════════════
// SplitMix64 (Gay.jl compatible)
// ═══════════════════════════════════════════════════════════════════════════

function splitmix64(seed) {
  let z = BigInt(seed) + 0x9E3779B97F4A7C15n;
  z = z & 0xFFFFFFFFFFFFFFFFn;
  z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & 0xFFFFFFFFFFFFFFFFn;
  z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & 0xFFFFFFFFFFFFFFFFn;
  return Number((z ^ (z >> 31n)) & 0xFFFFFFFFFFFFFFFFn);
}

function toRGB(h) {
  return [(h >> 16) & 0xFF, (h >> 8) & 0xFF, h & 0xFF];
}

function rgbToHue(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  let mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if (mx === mn) return 0;
  let d = mx - mn, h;
  if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return h * 60;
}

function hueToTrit(h) {
  h = h % 360;
  if (h < 60 || h >= 300) return 1;
  else if (h < 180) return 0;
  else return -1;
}

function hueToPitchClass(h) {
  return Math.floor(h / 30) % 12;
}

function pitchClassToFreq(pc, octave = 4) {
  const midi = 12 * (octave + 1) + pc;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// Just Intonation ratios
const JI_RATIOS = [1, 16/15, 9/8, 6/5, 5/4, 4/3, 45/32, 3/2, 8/5, 5/3, 9/5, 15/8];
function jiFreq(pc, octave = 4, fundamental = 261.63) {
  return fundamental * JI_RATIOS[pc % 12] * Math.pow(2, octave - 4);
}

// ═══════════════════════════════════════════════════════════════════════════
// Web Audio
// ═══════════════════════════════════════════════════════════════════════════

let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, trit, duration = 0.15, volume = 0.15) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = trit === 1 ? 'sine' : (trit === 0 ? 'triangle' : 'square');
  osc.frequency.value = freq;
  
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playChord(freqs, duration = 0.5, volume = 0.1) {
  freqs.forEach(f => playTone(f, 1, duration, volume / freqs.length));
}

// ═══════════════════════════════════════════════════════════════════════════
// Visualization State
// ═══════════════════════════════════════════════════════════════════════════

let particles = [];
let tritHistory = [];
let currentPhase = 'idle';
let phaseIndex = 0;
let lastTrit = 0;
let gf3Sum = 0;
let message = '';
let subMessage = '';

const TRIT_COLORS = {
  1: [255, 80, 80],    // 🔴 PLUS
  0: [80, 255, 120],   // 🟢 ERGODIC
  [-1]: [80, 120, 255] // 🔵 MINUS
};

class Particle {
  constructor(x, y, trit, hue) {
    this.x = x;
    this.y = y;
    this.trit = trit;
    this.hue = hue;
    this.size = 40;
    this.alpha = 255;
    this.vx = random(-1, 1);
    this.vy = random(-2, -0.5);
    this.rotation = random(TWO_PI);
    this.rotSpeed = random(-0.05, 0.05);
  }
  
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 2;
    this.size *= 0.995;
    this.rotation += this.rotSpeed;
    
    // Inside vs outside behavior
    if (currentPhase === 'outside') {
      this.vx += random(-0.3, 0.3); // chaotic
      this.vy += random(-0.2, 0.2);
    }
  }
  
  draw() {
    push();
    translate(this.x, this.y);
    rotate(this.rotation);
    
    let col = TRIT_COLORS[this.trit];
    fill(col[0], col[1], col[2], this.alpha);
    noStroke();
    
    if (this.trit === 1) {
      // Circle for +1
      ellipse(0, 0, this.size);
    } else if (this.trit === 0) {
      // Triangle for 0
      triangle(0, -this.size/2, -this.size/2, this.size/2, this.size/2, this.size/2);
    } else {
      // Square for -1
      rectMode(CENTER);
      rect(0, 0, this.size * 0.8, this.size * 0.8);
    }
    
    pop();
  }
  
  isDead() {
    return this.alpha <= 0;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Phase Sequences
// ═══════════════════════════════════════════════════════════════════════════

const INSIDE_SEQUENCE = [
  { tool: 'finder_search', trit: -1, koan: 'Observation collapses possibility' },
  { tool: 'oracle_think', trit: 0, koan: 'The middle path holds' },
  { tool: 'create_file', trit: 1, koan: 'Manifestation from void' },
];

const OUTSIDE_SEQUENCE = [
  { tool: 'read', trit: -1, koan: 'Once is observation...' },
  { tool: 'read', trit: -1, koan: 'Twice is obsession...' },
  { tool: 'read', trit: -1, koan: 'Thrice is the gap between map and territory' },
];

const META_SEQUENCE = [
  { concept: 'sonify.py', trit: 0, fragment: 'The script...' },
  { concept: 'sonify(sonify)', trit: 1, fragment: '...sonifying itself...' },
  { concept: 'GF(3)', trit: -1, fragment: '...while checking conservation...' },
  { concept: 'bisimulation', trit: 0, fragment: '...is indistinguishable from...' },
  { concept: 'music', trit: 1, fragment: '...music...' },
  { concept: 'silence', trit: -1, fragment: '...and silence.' },
];

const BISIMILAR_SEQUENCES = {
  iBeacon: [1, 0, -1, 1, 0, -1],
  PLR: [1, 0, -1, 1, 0, -1],
  GayJl: [] // Will be computed
};

// Compute Gay.jl sequence
let h = 0xCAFE;
for (let i = 0; i < 6; i++) {
  let [r, g, b] = toRGB(h);
  let hue = rgbToHue(r, g, b);
  BISIMILAR_SEQUENCES.GayJl.push(hueToTrit(hue));
  h = splitmix64(h);
}

let currentSequence = [];
let sequenceIndex = 0;
let sequenceTimer = 0;

function startSequence(seq, phaseName) {
  currentPhase = phaseName;
  currentSequence = seq;
  sequenceIndex = 0;
  gf3Sum = 0;
  tritHistory = [];
  sequenceTimer = millis();
}

// ═══════════════════════════════════════════════════════════════════════════
// p5.js
// ═══════════════════════════════════════════════════════════════════════════

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('monospace');
}

function draw() {
  // Dark gradient background
  background(10, 10, 15);
  
  // Draw grid (inside the lines)
  if (currentPhase === 'inside' || currentPhase === 'meta') {
    stroke(30, 30, 40);
    for (let x = 0; x < width; x += 50) line(x, 0, x, height);
    for (let y = 0; y < height; y += 50) line(0, y, width, y);
  }
  
  // Draw chaos (outside the lines)
  if (currentPhase === 'outside') {
    stroke(40, 20, 20, 50);
    for (let i = 0; i < 5; i++) {
      let x1 = random(width), y1 = random(height);
      let x2 = random(width), y2 = random(height);
      line(x1, y1, x2, y2);
    }
  }
  
  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].isDead()) particles.splice(i, 1);
  }
  
  // Draw trit history as waveform
  drawWaveform();
  
  // Draw GF(3) meter
  drawGF3Meter();
  
  // Draw phase info
  drawPhaseInfo();
  
  // Process sequence
  processSequence();
}

function drawWaveform() {
  if (tritHistory.length < 2) return;
  
  let waveY = height - 100;
  let waveWidth = width - 100;
  let step = waveWidth / Math.max(tritHistory.length - 1, 1);
  
  noFill();
  strokeWeight(3);
  
  beginShape();
  for (let i = 0; i < tritHistory.length; i++) {
    let x = 50 + i * step;
    let y = waveY - tritHistory[i].trit * 30;
    let col = TRIT_COLORS[tritHistory[i].trit];
    stroke(col[0], col[1], col[2], 200);
    vertex(x, y);
  }
  endShape();
  
  // Draw trit symbols
  for (let i = 0; i < tritHistory.length; i++) {
    let x = 50 + i * step;
    let y = waveY - tritHistory[i].trit * 30;
    let col = TRIT_COLORS[tritHistory[i].trit];
    fill(col[0], col[1], col[2]);
    noStroke();
    let sym = tritHistory[i].trit === 1 ? '🔴' : (tritHistory[i].trit === 0 ? '🟢' : '🔵');
    textSize(16);
    text(sym, x - 8, y + 6);
  }
  
  strokeWeight(1);
}

function drawGF3Meter() {
  let meterX = width - 150;
  let meterY = 80;
  
  fill(20, 20, 30);
  stroke(60, 60, 80);
  rect(meterX, meterY, 120, 60, 5);
  
  fill(200, 200, 220);
  noStroke();
  textSize(12);
  textAlign(LEFT);
  text('GF(3) Σ', meterX + 10, meterY + 20);
  
  let mod3 = ((gf3Sum % 3) + 3) % 3;
  let conserved = mod3 === 0;
  
  textSize(24);
  fill(conserved ? color(100, 255, 150) : color(255, 100, 100));
  text(gf3Sum + ' ≡ ' + mod3, meterX + 10, meterY + 48);
  
  if (conserved) {
    fill(100, 255, 150);
    textSize(10);
    text('✓ CONSERVED', meterX + 10, meterY + 58);
  }
}

function drawPhaseInfo() {
  textAlign(LEFT);
  textSize(18);
  
  let phaseColor;
  switch(currentPhase) {
    case 'inside': phaseColor = color(100, 255, 100); break;
    case 'outside': phaseColor = color(255, 100, 100); break;
    case 'meta': phaseColor = color(255, 200, 100); break;
    case 'bisimilar': phaseColor = color(100, 200, 255); break;
    default: phaseColor = color(150, 150, 150);
  }
  
  fill(phaseColor);
  text(message, 50, 50);
  
  fill(150, 150, 150);
  textSize(14);
  text(subMessage, 50, 75);
}

function processSequence() {
  if (currentSequence.length === 0) return;
  if (sequenceIndex >= currentSequence.length) {
    // Sequence complete
    if (currentPhase === 'bisimilar' && sequenceIndex < 18) {
      // Continue with next bisimilar set
    } else {
      setTimeout(() => {
        message = 'METAIRONY COMPLETE';
        subMessage = 'The map mapped itself';
      }, 500);
      return;
    }
  }
  
  let elapsed = millis() - sequenceTimer;
  let interval = currentPhase === 'bisimilar' ? 200 : 400;
  
  if (elapsed > interval && sequenceIndex < currentSequence.length) {
    let item = currentSequence[sequenceIndex];
    let trit = item.trit !== undefined ? item.trit : item;
    
    // Update state
    gf3Sum += trit;
    lastTrit = trit;
    tritHistory.push({ trit: trit, time: millis() });
    
    // Spawn particles
    let px = width/2 + random(-100, 100);
    let py = height/2 + random(-50, 50);
    for (let i = 0; i < 5; i++) {
      particles.push(new Particle(px + random(-20, 20), py + random(-20, 20), trit, 0));
    }
    
    // Play sound
    let pc = (sequenceIndex * 2) % 12;
    let freq = jiFreq(pc, 4 + trit);
    playTone(freq, trit, 0.2);
    
    // Update message
    if (item.koan) subMessage = '"' + item.koan + '"';
    else if (item.fragment) subMessage = item.fragment;
    else if (item.tool) subMessage = item.tool;
    else if (item.concept) subMessage = item.concept;
    
    sequenceIndex++;
    sequenceTimer = millis();
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

// ═══════════════════════════════════════════════════════════════════════════
// Control Functions
// ═══════════════════════════════════════════════════════════════════════════

function playInside() {
  message = '━━━ INSIDE THE LINES ━━━';
  subMessage = 'READ(-1) + COMPUTE(0) + WRITE(+1) = 0';
  startSequence(INSIDE_SEQUENCE, 'inside');
}

function playOutside() {
  message = '━━━ OUTSIDE THE LINES ━━━';
  subMessage = 'The heresy: breaking conservation...';
  startSequence(OUTSIDE_SEQUENCE, 'outside');
}

function playMeta() {
  message = '━━━ METAIRONIC BRIDGE ━━━';
  subMessage = 'The joke that knows it\'s a joke';
  startSequence(META_SEQUENCE, 'meta');
}

function playBisimilar() {
  message = '━━━ SURPRISING BISIMILARITY ━━━';
  subMessage = 'iBeacon ≅ PLR ≅ Gay.jl';
  
  // Combine all three sequences with labels
  let combined = [];
  ['iBeacon', 'PLR', 'GayJl'].forEach(name => {
    BISIMILAR_SEQUENCES[name].forEach(t => combined.push({ trit: t, concept: name }));
  });
  
  startSequence(combined, 'bisimilar');
}

function playAll() {
  message = '╔══ FULL METAIRONY ══╗';
  subMessage = 'Coloring outside AND inside the lines';
  
  // Play opening chord
  playChord([261.63, 329.63, 392.00, 523.25], 0.8, 0.15);
  
  setTimeout(playInside, 1000);
  setTimeout(playOutside, 3000);
  setTimeout(playMeta, 5500);
  setTimeout(playBisimilar, 9000);
  setTimeout(() => {
    message = '═══ THE MAP MAPPED ITSELF ═══';
    subMessage = '(silence is also a trit)';
    playChord([523.25, 659.26, 783.99, 1046.50], 1.5, 0.12);
  }, 13000);
}

function mousePressed() {
  initAudio();
  document.getElementById('info').innerText = 'METAIRONY • Select a mode below';
}
</script>
</body>
</html>
