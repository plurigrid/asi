name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: "1.12.208"

      - name: Install Python test deps
        run: python3 -m pip install --upgrade pip pytest

      - name: Emit loadable-skills manifest (single membership oracle)
        # Generated from the same codex-rs-faithful lint that gates the build.
        # The invariant harness below consumes it so reachability/monotone
        # invariants are computed over exactly the skills the runtimes can load.
        run: bb scripts/skillmd_lint.bb skills --manifest=invariants/loadable_skills.json || true

      - name: Validate skills.json schema
        run: |
          echo "Validating skills.json..."
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('skills.json', 'utf8'));

            if (!Array.isArray(data.skills)) {
              console.error('ERROR: skills must be an array');
              process.exit(1);
            }

            const required = ['name', 'description', 'category', 'author', 'license'];
            const names = new Set();
            let errors = 0;

            data.skills.forEach((skill) => {
              required.forEach((field) => {
                if (!skill[field]) {
                  console.error('ERROR: Skill ' + (skill.name || '<unknown>') + ' missing ' + field);
                  errors++;
                }
              });

              if (skill.name && !/^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$/.test(skill.name)) {
                console.error('ERROR: Invalid skill name format: ' + skill.name);
                errors++;
              }

              if (skill.name && names.has(skill.name)) {
                console.error('ERROR: Duplicate skill name: ' + skill.name);
                errors++;
              }
              if (skill.name) names.add(skill.name);
            });

            if (errors > 0) {
              console.error('Found ' + errors + ' errors');
              process.exit(1);
            }

            console.log('✓ skills.json is valid (' + data.skills.length + ' skills)');
          "

      - name: Validate listed skill folders and frontmatter
        run: |
          echo "Validating listed skills..."
          node -e "
            const fs = require('fs');
            const path = require('path');

            const data = JSON.parse(fs.readFileSync('skills.json', 'utf8'));
            const skillsDir = 'skills';
            let errors = 0;

            data.skills.forEach((skill) => {
              const folder = path.join(skillsDir, skill.name);
              const skillMd = path.join(folder, 'SKILL.md');

              if (!fs.existsSync(folder)) {
                console.error('ERROR: Folder missing for listed skill: ' + skill.name);
                errors++;
                return;
              }

              if (!fs.existsSync(skillMd)) {
                console.error('ERROR: SKILL.md missing for listed skill: ' + skill.name);
                errors++;
                return;
              }

              const content = fs.readFileSync(skillMd, 'utf8');
              if (!content.startsWith('---')) {
                console.error('ERROR: ' + skill.name + '/SKILL.md missing YAML frontmatter');
                errors++;
                return;
              }

              const end = content.indexOf('---', 3);
              if (end === -1) {
                console.error('ERROR: ' + skill.name + '/SKILL.md has unclosed frontmatter');
                errors++;
                return;
              }

              const frontmatter = content.slice(3, end);
              if (!frontmatter.includes('name:')) {
                console.error('ERROR: ' + skill.name + '/SKILL.md missing name in frontmatter');
                errors++;
              }
              if (!frontmatter.includes('description:')) {
                console.error('ERROR: ' + skill.name + '/SKILL.md missing description in frontmatter');
                errors++;
              }
            });

            if (errors > 0) {
              process.exit(1);
            }

            console.log('✓ Listed skill folders and frontmatter are valid');
          "

      - name: Enforce monotonic skill invariants
        run: |
          python3 scripts/enforce_skill_invariants.py \
            --skills-dir skills \
            --config invariants/skill_invariants_config.json \
            --state invariants/skill_invariants_state.json \
            --loadable-manifest invariants/loadable_skills.json

      - name: Run invariant unit tests
        run: python3 -m pytest -q tests/test_skill_invariants.py

      - name: Run CLI regression tests
        run: node test.js

      - name: Validate CLI loads
        run: node cli.js list > /dev/null && echo "✓ CLI loads successfully"

  skillmd-portability:
    # Strict, codex-rs-faithful SKILL.md frontmatter lint. The JS check in the
    # `validate` job only substring-matches `name:`/`description:`; it cannot see
    # the failures that actually drop a skill at TUI load time (indented keys
    # folded into a scalar, `metadata:` as a string, name/dir > 64 chars,
    # git conflict markers, unparseable YAML). This job parses every SKILL.md
    # with the same acceptance rules as codex-rs/core-skills/src/loader.rs so a
    # skill that loads in CI loads in codex, claude, and agy alike.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: "1.12.208"

      - name: Lint SKILL.md frontmatter (all skills, codex semantics)
        run: bb scripts/skillmd_lint.bb skills --ci

  juvix-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Juvix
        uses: jaxxstorm/action-install-gh-release@v1.12.0
        with:
          repo: anoma/juvix
          tag: v0.6.10
          cache: enable
          extension-matching: disable
          rename-to: juvix
          chmod: 0755

      - name: Verify Juvix installation
        run: juvix --version

      - name: Typecheck formalization
        run: |
          cd formalization
          juvix typecheck SkillReachabilityInvariant.juvix
          echo "✓ Juvix formalization typechecks"
