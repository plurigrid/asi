name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest

      - name: Copy skills-ref.bb
        run: |
          curl -sL https://raw.githubusercontent.com/plurigrid/asi/main/skills-ref.bb -o skills-ref.bb || cp ../skills-ref.bb . 2>/dev/null || true

      - name: Validate skill directories
        run: |
          echo "Validating skill directories..."
          ERRORS=0
          
          for dir in skills/*/; do
            if [ -f "${dir}SKILL.md" ]; then
              if bb skills-ref.bb validate "$dir" 2>&1; then
                echo "✓ $dir"
              else
                echo "✗ $dir"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS validation errors"
            exit 1
          fi
          
          echo "All skills validated successfully"

      - name: Validate skills.json schema
        run: |
          echo "Validating skills.json..."
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('skills.json', 'utf8'));

            if (!Array.isArray(data.skills)) {
              console.error('ERROR: skills must be an array');
              process.exit(1);
            }

            const required = ['name', 'description', 'category', 'author', 'license'];
            const names = new Set();
            let errors = 0;

            data.skills.forEach((skill, i) => {
              required.forEach(field => {
                if (!skill[field]) {
                  console.error('ERROR: Skill ' + skill.name + ' missing ' + field);
                  errors++;
                }
              });

              if (names.has(skill.name)) {
                console.error('ERROR: Duplicate skill name: ' + skill.name);
                errors++;
              }
              names.add(skill.name);

              if (!/^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$/.test(skill.name)) {
                console.error('ERROR: Invalid skill name format: ' + skill.name);
                errors++;
              }
            });

            if (errors > 0) {
              console.error('Found ' + errors + ' errors');
              process.exit(1);
            }

            console.log('✓ skills.json is valid (' + data.skills.length + ' skills)');
          "

      - name: Check GF(3) balance
        run: |
          echo "Checking GF(3) triadic balance..."
          bb -e '
            (require (quote [cheshire.core :as json]))
            (let [data (json/parse-string (slurp "skills.json") true)
                  skills (:skills data)
                  trits (keep :trit skills)
                  sum (reduce + 0 trits)
                  balanced (zero? (mod sum 3))]
              (println (format "Total skills: %d" (count skills)))
              (println (format "Skills with trit: %d" (count trits)))
              (println (format "Trit sum: %d" sum))
              (println (format "GF(3) balanced: %s" (if balanced "YES" "NO")))
              (when-not balanced
                (System/exit 1)))
          '
